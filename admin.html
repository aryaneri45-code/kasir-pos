<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Kasir POS</title>
    <style>
        :root {
            --primary: #0f766e;
            --secondary: #ff7a00;
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --success: #16a34a;
            --warning: #f59e0b;
            --danger: #dc2626;
            --border: #e5e7eb;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .topbar {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: white;
            padding: 18px 24px;
            box-shadow: 0 12px 20px rgba(15, 23, 42, 0.1);
        }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 20px 40px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.04);
        }
        .label { font-size: 0.8rem; color: var(--muted); }
        .value { font-size: 1.8rem; font-weight: 800; margin-top: 10px; }
        .table-wrap { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 16px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th { background: #eef6f6; }
        .status-pill {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            background: #ecfdf5;
            color: var(--success);
        }
        .button-link {
            display: inline-block;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 700;
            margin-top: 12px;
        }
        @media (max-width: 640px) {
            .value { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <h2 style="margin:0;">Dashboard Admin</h2>
    </div>

    <div class="container">
        <a class="button-link" href="./index.kasir.html">← Kembali ke Kasir</a>

        <div class="grid" id="summaryCards"></div>

        <div class="card" style="margin-bottom: 24px;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 14px;">
                <h3 style="margin: 0;">� Detail Laporan Harian</h3>
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <label for="dailyDetailDate" style="font-weight: 700;">Tanggal</label>
                    <input id="dailyDetailDate" type="date" value="" style="padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;">
                    <button class="button-link" id="loadDailyDetail" style="margin-top: 0;">Tampilkan</button>
                    <button class="button-link" id="exportDailyCsv" style="margin-top: 0; background: var(--success);">Export CSV</button>
                    <button class="button-link" id="exportDailyPdf" style="margin-top: 0; background: var(--secondary);">Export PDF</button>
                </div>
            </div>

            <div id="dailyDetailSummary" style="margin-bottom: 12px; font-weight: 700; color: var(--muted);"></div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Waktu</th>
                            <th>Kasir</th>
                            <th>Total</th>
                            <th>Uang</th>
                            <th>Kembalian</th>
                            <th>Detail Item</th>
                        </tr>
                    </thead>
                    <tbody id="dailyDetailTable"></tbody>
                </table>
            </div>
        </div>

        <div class="card" style="margin-bottom: 24px;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 14px;">
                <h3 style="margin: 0;">�📦 Arsip Transaksi Bulanan</h3>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button class="button-link" id="exportMonthlyCsv" style="margin-top: 0;">Export CSV</button>
                    <button class="button-link" id="exportMonthlyPdf" style="margin-top: 0; background: var(--secondary);">Export PDF</button>
                </div>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Bulan</th>
                            <th>Jumlah Transaksi</th>
                            <th>Total Penjualan</th>
                        </tr>
                    </thead>
                    <tbody id="monthlyTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="./assets/js/admin.js"></script>
</body>
</html>
